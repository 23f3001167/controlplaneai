services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: controlplane-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: controlplane-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: '*'

  # 2. React Frontend Static Site
  - type: web
    name: controlplane-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: ${controlplane-backend.url}/api/v1


databases:
  # 3. PostgreSQL Managed Database
  - name: controlplane-db
    databaseName: controlplane
    plan: free
